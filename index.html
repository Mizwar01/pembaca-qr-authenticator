<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pembaca QR Google Authenticator</title>
<style>
    :root {
        --bg: #f4f6f8;
        --text: #333;
        --card-bg: white;
        --card-shadow: rgba(0,0,0,0.1);
        --input-bg: #f9f9f9;
        --input-border: #ccc;
        --footer-text: #6b7280;
        --link: #3b82f6;
    }
    body.dark {
        --bg: #0f1115;
        --text: #e5e7eb;
        --card-bg: #1a1d23;
        --card-shadow: rgba(0,0,0,0.4);
        --input-bg: #262a33;
        --input-border: #3a3f4b;
        --footer-text: #9ca3af;
        --link: #60a5fa;
    }
    * { box-sizing: border-box; }
    body {font-family: monospace, sans-serif;background: var(--bg);color: var(--text);padding: 16px;transition: background 0.2s, color 0.2s;}
    p {font-family: monospace}
    h1 {color: #2c3e50;font-size: 24px;}
    .container {background: var(--card-bg);padding: 20px;border-radius: 10px;max-width: 40em;margin: auto;box-shadow: 0 4px 10px var(--card-shadow);}
    .top-bar {display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
    .theme-toggle {background: var(--input-bg);border: 1px solid var(--input-border);border-radius: 8px;padding: 8px 12px;cursor: pointer;font-family: monospace;font-size: 0.9rem;color: var(--text);flex-shrink:0;}
    .theme-toggle:hover {opacity: 0.85;}
    input[type="file"] {margin-top: 10px;padding: 8px;font-family: monospace;border: 1px solid var(--input-border);border-radius: 6px;background: var(--input-bg);color: var(--text);width: 100%;box-sizing: border-box;font-size: 1rem;}
    #dropzone {margin-top:10px;border: 2px dashed var(--input-border);border-radius: 10px;padding: 18px;text-align:center;color: var(--footer-text);transition: border-color 0.2s, background 0.2s;}
    #dropzone.dragover {border-color: #3498db;background: rgba(52,152,219,0.08);}
    #preview {display:none;margin-top:14px;text-align:center;}
    #preview img {max-width: 200px;max-height: 200px;border-radius: 8px;border: 1px solid var(--input-border);box-shadow: 0 2px 6px var(--card-shadow);}
    #status {margin-top: 16px;font-family: monospace;color: var(--footer-text);display:none;align-items:center;gap:8px;}
    .spinner {width: 16px;height: 16px;border: 3px solid #d1d5db;border-top-color: #3498db;border-radius: 50%;animation: spin 0.7s linear infinite;}
    @keyframes spin { to { transform: rotate(360deg); } }
    #output {margin-top: 20px;}
    .msg {background: #1e1e1e;color: #f87171;padding: 15px;border-radius: 6px;font-family: monospace;white-space: pre-wrap;word-break: break-word;}
    .msg.ok {color: #00ff88;}
    .account-card {background: #1e1e1e;color: #00ff88;padding: 15px;border-radius: 6px;margin-bottom: 12px;font-family: monospace;position: relative;}
    .account-card .row {white-space: pre-wrap;margin-bottom: 4px;word-break: break-word;}
    .account-card .row .label {color: #9ca3af;}
    .copy-btn {margin-top: 8px;padding: 8px 12px;background: #3498db;color: white;border: none;border-radius: 6px;cursor: pointer;font-family: monospace;font-size: 0.85rem;width: 100%;}
    .copy-btn:hover {background: #2980b9;}
    .copy-btn.copied {background: #16a34a;}
    .footer {margin-top: 2rem;text-align: center;font-size: 0.875rem;color: var(--footer-text);}
    .footer a {color: var(--link);font-weight: 600;text-decoration: none;}
    .footer a:hover {text-decoration: underline;}

    @media (max-width: 480px) {
        body { padding: 10px; }
        .container { padding: 14px; border-radius: 8px; }
        h3 { font-size: 1.05rem; }
        .theme-toggle { padding: 6px 10px; font-size: 0.8rem; }
        #preview img { max-width: 160px; max-height: 160px; }
        .copy-btn { padding: 10px 12px; font-size: 0.9rem; }
    }
</style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <div>
            <h3 style="margin-bottom: 5px">🔍 Pembaca QR Google Authenticator</h3>
            <p style="margin-top:0">Unggah gambar kode QR 2FA untuk mengekstrak akun dan secret-nya.</p>
        </div>
        <button class="theme-toggle" id="themeToggle">🌙 Dark</button>
    </div>

    <div id="dropzone">
        <input type="file" id="fileInput" accept="image/*">
        <div style="margin-top:8px;font-size:0.85rem;">atau seret gambar QR ke sini</div>
    </div>

    <div id="preview">
        <img id="previewImg" alt="Preview QR">
    </div>

    <div id="status">
        <div class="spinner"></div>
        <span>Membaca kode QR...</span>
    </div>

    <div id="output">
        <div class="msg">Silakan Upload QR Google Authenticator</div>
    </div>

    <div class="footer">
        📂 Buka Aplikasi di <a href="https://mizwar01.github.io/pembaca-qr-authenticator/" target="_blank">GitHub Pages</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/protobufjs/dist/protobuf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
<script>
const fileInput = document.getElementById('fileInput');
const dropzone = document.getElementById('dropzone');
const preview = document.getElementById('preview');
const previewImg = document.getElementById('previewImg');
const status = document.getElementById('status');
const output = document.getElementById('output');
const themeToggle = document.getElementById('themeToggle');

// Dark mode
function applyTheme(dark) {
    document.body.classList.toggle('dark', dark);
    themeToggle.textContent = dark ? '☀️ Light' : '🌙 Dark';
}
const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
applyTheme(prefersDark);
themeToggle.addEventListener('click', () => {
    applyTheme(!document.body.classList.contains('dark'));
});

fileInput.addEventListener('change', handleFile);

// Drag & drop
['dragenter', 'dragover'].forEach(evt => {
    dropzone.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.add('dragover');
    });
});
['dragleave', 'drop'].forEach(evt => {
    dropzone.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.remove('dragover');
    });
});
dropzone.addEventListener('drop', (e) => {
    const file = e.dataTransfer.files[0];
    if (file) {
        fileInput.files = e.dataTransfer.files;
        handleFile({ target: { files: [file] } });
    }
});

function showStatus(show) {
    status.style.display = show ? 'flex' : 'none';
}

function setMessage(text, ok) {
    output.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'msg' + (ok ? ' ok' : '');
    div.textContent = text;
    output.appendChild(div);
}

function handleFile(evt) {
    const file = evt.target.files[0];
    if (!file) return;

    output.innerHTML = '';
    preview.style.display = 'none';

    const reader = new FileReader();
    reader.onload = function(e) {
        previewImg.src = e.target.result;
        preview.style.display = 'block';

        showStatus(true);

        const img = new Image();
        img.onload = function() {
            setTimeout(() => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                showStatus(false);

                if (code) {
                    processQR(code.data);
                } else {
                    setMessage("❌ QR code tidak terbaca.", false);
                }
            }, 150);
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function renderAccountCard(nama, issuer, secret) {
    const card = document.createElement('div');
    card.className = 'account-card';

    const rowNama = document.createElement('div');
    rowNama.className = 'row';
    rowNama.innerHTML = `<span class="label">Nama   :</span> ${nama}`;
    card.appendChild(rowNama);

    const rowIssuer = document.createElement('div');
    rowIssuer.className = 'row';
    rowIssuer.innerHTML = `<span class="label">Issuer :</span> ${issuer}`;
    card.appendChild(rowIssuer);

    const rowSecret = document.createElement('div');
    rowSecret.className = 'row';
    rowSecret.innerHTML = `<span class="label">Secret :</span> ${secret}`;
    card.appendChild(rowSecret);

    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = '📋 Copy Secret';
    btn.onclick = function() {
        navigator.clipboard.writeText(secret).then(() => {
            btn.textContent = '✅ Tersalin!';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.textContent = '📋 Copy Secret';
                btn.classList.remove('copied');
            }, 1500);
        }).catch(() => {
            btn.textContent = '❌ Gagal copy';
        });
    };
    card.appendChild(btn);

    return card;
}

function processQR(qrText) {
    output.innerHTML = '';
    try {
        if (qrText.startsWith("otpauth://")) {
            const url = new URL(qrText);
            const secret = url.searchParams.get("secret");
            const issuer = url.searchParams.get("issuer") || "(tidak ada)";
            const label = decodeURIComponent(url.pathname.replace(/^\/\//, ''));
            if (secret) {
                output.appendChild(renderAccountCard(label, issuer, secret));
            } else {
                setMessage("⚠️ Secret tidak ditemukan di QR.", false);
            }
            return;
        }
        const url = new URL(qrText);
        let dataParam = url.searchParams.get("data");

        if (!dataParam) {
            setMessage("⚠️ Parameter data= tidak ditemukan.", false);
            return;
        }

        dataParam = dataParam.replace(/ /g, '+').replace(/%20/g, '+').replace(/%2B/gi, '+');

        const binary = atob(dataParam);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }

        const root = protobuf.Root.fromJSON({
            nested: {
                MigrationPayload: {
                    fields: {
                        otpParameters: { rule: "repeated", type: "OtpParameters", id: 1 },
                        version: { type: "int32", id: 2 },
                        batchSize: { type: "int32", id: 3 },
                        batchIndex: { type: "int32", id: 4 },
                        batchId: { type: "bytes", id: 5 }
                    }
                },
                OtpParameters: {
                    fields: {
                        secret: { type: "bytes", id: 1 },
                        name: { type: "string", id: 2 },
                        issuer: { type: "string", id: 3 },
                        algorithm: { type: "int32", id: 4 },
                        digits: { type: "int32", id: 5 },
                        type: { type: "int32", id: 6 },
                        counter: { type: "int64", id: 7 }
                    }
                }
            }
        });

        const MigrationPayload = root.lookupType("MigrationPayload");
        const payload = MigrationPayload.decode(bytes);

        if (!payload.otpParameters || payload.otpParameters.length === 0) {
            setMessage("⚠️ Tidak ada akun ditemukan di payload migrasi.", false);
            return;
        }

        payload.otpParameters.forEach((param) => {
            const secretBase32 = base32Encode(param.secret);
            output.appendChild(renderAccountCard(param.name, param.issuer, secretBase32));
        });
    } catch (err) {
        setMessage("❌ Error: " + err.message, false);
    }
}

function base32Encode(bytes) {
    const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
    let bits = 0, value = 0, output = '';
    for (let i = 0; i < bytes.length; i++) {
        value = (value << 8) | bytes[i];
        bits += 8;
        while (bits >= 5) {
            output += alphabet[(value >>> (bits - 5)) & 31];
            bits -= 5;
        }
    }
    if (bits > 0) {
        output += alphabet[(value << (5 - bits)) & 31];
    }
    return output;
}
</script>
</body>
</html>
